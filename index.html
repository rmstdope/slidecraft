<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Slidecraft</title>
    <script>
      // The app theme before the first paint (src/appearance/appearance.ts; kept in step by tests).
      ;(function () {
        var a = {}
        try {
          a = JSON.parse(localStorage.getItem('slidecraft.appearance') || '{}') || {}
        } catch (e) {}
        var t = a.theme === 'light' || a.theme === 'dark' ? a.theme : 'system'
        if (t === 'system') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            t = 'light'
          }
        }
        var accents = ['violet', 'indigo', 'coral', 'mint']
        var r = document.documentElement
        r.setAttribute('data-sc-theme', t)
        r.setAttribute('data-sc-accent', accents.indexOf(a.darkAccent) >= 0 ? a.darkAccent : 'violet')
      })()
    </script>
    <!-- Bare imports of vault components go to the app's own modules (shared/vaultRuntime.ts). -->
    <script type="importmap">
      {
        "imports": {
          "slidecraft": "%BASE_URL%vault-runtime/slidecraft.js",
          "react": "%BASE_URL%vault-runtime/react.js",
          "react/jsx-runtime": "%BASE_URL%vault-runtime/react-jsx-runtime.js",
          "motion/react": "%BASE_URL%vault-runtime/motion-react.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
